name: Keep Ternary Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          set -e
          curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 \
            https://ternary-control.onrender.com/health
