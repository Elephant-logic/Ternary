# Render FREE Blueprint for Ternary.
# No SQL and no persistent Render disk: runtime state/event history are JSON.
# Durable snapshots are written to a dedicated GitHub branch.

services:
  - type: web
    name: ternary-control
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: python unpack_bundle.py && cp -R overrides/. .render_src/ && cd .render_src && pip install -r requirements.txt && python -m tests.run_all
    startCommand: cd .render_src && uvicorn service.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TERN_STATE
        value: /tmp/ternary/state.json
      - key: TERN_EVENTLOG
        value: /tmp/ternary/eventlog.json
      - key: TERN_AUTOSTART
        value: "1"
      - key: TERN_MODE
        value: PAPER
      - key: TERN_CONTROL_TOKEN
        sync: false

      # Durable no-SQL JSON snapshot stored in GitHub.
      # Create a fine-grained GitHub token with Contents: Read and write for
      # the state repository, then paste it into Render when prompted.
      - key: GITHUB_STATE_TOKEN
        sync: false
      - key: GITHUB_STATE_REPO
        value: Elephant-logic/Ternary
      - key: GITHUB_STATE_BRANCH
        value: state
      - key: GITHUB_STATE_PATH
        value: runtime/ternary-state.json
      - key: TERN_REMOTE_SAVE_MIN_SECONDS
        value: "300"

      # LIVE credentials intentionally remain unset for this PAPER/free profile.
      # - key: TERN_LIVE_API_KEY
      #   sync: false
      # - key: TERN_LIVE_API_SECRET
      #   sync: false
